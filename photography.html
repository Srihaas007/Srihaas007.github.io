<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography | Srihaas Gorantla</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SHJK4J22QE"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-SHJK4J22QE');
    </script>

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- CSS -->
    <link rel="stylesheet" href="css/photography.css">
</head>

<body>

    <!-- Header (Ported from Header.tsx) -->
    <header class="header">
        <nav class="nav-container">
            <a href="index.html" class="logo">Srihaas.</a>

            <div class="nav-links">
                <a href="#work" class="nav-link active">Work</a>
                <a href="index.html#about" class="nav-link">About</a>
                <a href="index.html#contact" class="nav-link">Contact</a>
            </div>

            <!-- Mobile Menu Toggle (Simplified for HTML version) -->
            <div class="mobile-toggle" style="display: none;">
                <i class="fas fa-bars"></i>
            </div>
        </nav>
    </header>

    <!-- Hero Section (Ported from Hero.tsx) -->
    <section class="hero">
        <div class="hero-bg">
            <img src="https://ik.imagekit.io/u9j5vtftw/photos/Aesthetics/_DSC0392%20(2).JPG?updatedAt=1730044171232"
                alt="Hero Background">
        </div>
        <div class="hero-overlay"></div>

        <div class="hero-content">
            <h1 class="hero-title animate-fade-in" style="animation-delay: 0.2s;">
                Capturing Moments,<br>
                <span class="highlight">Telling Stories</span>
            </h1>
            <p class="hero-subtitle animate-fade-in" style="animation-delay: 0.4s;">
                A visual journey through landscapes, portraits, and the quiet poetry of everyday life.
            </p>
            <button class="btn-explore animate-fade-in" style="animation-delay: 0.6s;"
                onclick="document.getElementById('work').scrollIntoView({behavior: 'smooth'})">
                Explore Work
                <i class="fas fa-arrow-down"></i>
            </button>
        </div>
    </section>

    <!-- Main Gallery Section -->
    <section id="work" class="gallery-section">

        <!-- Filter Bar (Preserved functionality, adapted style) -->
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="aesthetics">Aesthetics</button>
            <button class="filter-btn" data-filter="city-lights">City Lights</button>
            <button class="filter-btn" data-filter="water-bodies">Water Bodies</button>
            <button class="filter-btn" data-filter="animals">Animals</button>
            <button class="filter-btn" data-filter="moon-sun">Moon & Sun</button>
            <button class="filter-btn" data-filter="cars-toys">Cars & Toys</button>
            <button class="filter-btn" data-filter="india">India</button>
        </div>

        <!-- Masonry Grid (Ported Grid Structure) -->
        <div class="masonry-grid" id="gallery-grid">
            <!-- Items injected by JS -->
        </div>

    </section>

    <!-- Lightbox (Ported from Lightbox.tsx) -->
    <div id="lightbox" class="lightbox">
        <button class="lightbox-close" aria-label="Close lightbox">
            <i class="fas fa-times"></i>
        </button>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="Full View">
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/photography-app.js"></script>

</body>

</html>
