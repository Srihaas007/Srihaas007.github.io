<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography | Srihaas Gorantla</title>

    <!-- Cache Control -->
    <meta http-equiv="Cache-Control" content="public, max-age=31536000, immutable">
    <meta http-equiv="Expires" content="31536000">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SHJK4J22QE"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-SHJK4J22QE');
    </script>

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- CSS -->
    <link rel="stylesheet" href="css/photography.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <nav class="nav-container">
            <a href="index.html" class="logo">Srihaas.</a>

            <div class="nav-links">
                <a href="index.html" class="nav-link">
                    <i class="fas fa-arrow-left"></i> Back to Portfolio
                </a>
                <a href="#work" class="nav-link active">Work</a>
                <a href="index.html#about" class="nav-link">About</a>
                <a href="index.html#contact" class="nav-link">Contact</a>
            </div>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-bg">
            <img src="https://ik.imagekit.io/u9j5vtftw/photos/Water%20Bodies/IMG_2002.DNG?updatedAt=1730042462208"
                alt="Hero Background">
        </div>
        <div class="hero-overlay"></div>

        <div class="hero-content">
            <h1 class="hero-title animate-fade-in" style="animation-delay: 0.2s;">
                Capturing Moments,<br>
                <span class="highlight">Telling Stories</span>
            </h1>
            <p class="hero-subtitle animate-fade-in" style="animation-delay: 0.4s;">
                A visual journey through landscapes, portraits, and the quiet poetry of everyday life.
            </p>
            <button class="btn-explore animate-fade-in" style="animation-delay: 0.6s;"
                onclick="document.getElementById('work').scrollIntoView({behavior: 'smooth'})">
                Explore Work
                <i class="fas fa-arrow-down"></i>
            </button>
        </div>
    </section>

    <!-- Main Gallery Section -->
    <section id="work" class="gallery-section">

        <!-- Navigation/Filter Bar -->
        <div class="filter-bar" id="filter-bar" style="display: none;">
            <button class="filter-btn back-btn" onclick="showHome()">
                <i class="fas fa-arrow-left"></i> Collections
            </button>
            <span class="filter-divider">|</span>
            <!-- Current Category Title will be injected here via JS -->
            <span id="current-category-title" class="current-category-label"></span>
        </div>

        <!-- Collections Home View -->
        <div id="collections-home" class="animate-fade-in">
            <!-- Collection Preview Sections Injected by JS -->
        </div>

        <!-- Detailed View (Masonry Grid) -->
        <div class="masonry-grid" id="gallery-grid" style="display: none;">
            <!-- Items injected by JS -->
        </div>

    </section>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
        <button class="lightbox-close" aria-label="Close lightbox">
            <i class="fas fa-times"></i>
        </button>
        <div class="lightbox-content">
            <div class="lightbox-image-container">
                <img id="lightbox-img" src="" alt="Full View">
            </div>
            <div class="lightbox-poetry-panel">
                <p id="lightbox-poetry" class="lightbox-poetry-text"></p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/photography-app.js"></script>

</body>

</html>
